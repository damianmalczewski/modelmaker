[versions]
gson = "2.14.0"
assertj = "3.27.7"
junit = "6.1.3"
jspecify = "1.0.1"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.1"
kotlin = "2.4.10"
spotless = "8.10.2"
plugin-publish = "2.1.1"
plugin-compatibility = "1.0.0"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
plugin-compatibility = { id = "org.gradle.plugin-compatibility", version.ref = "plugin-compatibility" }

[libraries]
# BOMs
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-bom = { module = "org.assertj:assertj-bom", version.ref = "assertj" }

# direct versions
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# versions managed by BOMs
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }

# exclusions
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotationS" }
