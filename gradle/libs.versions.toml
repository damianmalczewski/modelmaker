[versions]
assertj = "3.27.7"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
gson = "2.14.0"
junit = "6.1.3"
jspecify = "1.0.1"
kotlin = "2.4.20"
kover = "0.9.9"
maven-plugin-annotations = "3.15.2"
maven-core = "3.9.16"
maven-plugin-api = "3.9.16"
maven-plugin-development = "1.0.3"
nullaway = "0.14.1"
plugin-compatibility = "1.0.0"
plugin-publish = "2.2.0"
spotless = "8.10.2"

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
maven-plugin-development = { id = "org.gradlex.maven-plugin-development", version.ref = "maven-plugin-development" }
plugin-compatibility = { id = "org.gradle.plugin-compatibility", version.ref = "plugin-compatibility" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# BOMs
assertj-bom = { module = "org.assertj:assertj-bom", version.ref = "assertj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# direct versions
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-annotations" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven-core" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven-plugin-api" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# versions managed by BOMs
assertj-core = { module = "org.assertj:assertj-core" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# exclusions
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations" }
