name: Release

on:
  push:
    tags:
      - "modelmaker/v[0-9]*.[0-9]*.[0-9]*"
      - "modelmaker/v[0-9]*.[0-9]*.[0-9]*-*"
      - "plugin-gradle/v[0-9]*.[0-9]*.[0-9]*"
      - "plugin-gradle/v[0-9]*.[0-9]*.[0-9]*-*"
      - "plugin-maven/v[0-9]*.[0-9]*.[0-9]*"
      - "plugin-maven/v[0-9]*.[0-9]*.[0-9]*-*"

jobs:
  release:
    name: Release Module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve module from tag
        id: target
        run: |
          TAG="$GITHUB_REF_NAME"
          MODULE="${TAG%%/*}"        # modelmaker/v1.2.3     -> modelmaker
          VERSION="${TAG#*/v}"       # plugin-gradle/v1.2.3  -> 1.2.3
          case "$MODULE" in
            modelmaker)
              DIRECTORY="modelmaker"
              ARGUMENTS="-PreleaseModule=modelmaker nmcpPublishAggregationToCentralPortal"
              ;;
            plugin-gradle)
              DIRECTORY="plugin-gradle"
              ARGUMENTS=":modelmaker-gradle-plugin:publishPlugins"
              ;;
            plugin-maven)
              DIRECTORY="plugin-maven"
              ARGUMENTS="-PreleaseModule=plugin-maven nmcpPublishAggregationToCentralPortal"
              ;;
            *)
              echo "::error::unknown module in tag '$TAG'"
              exit 1
              ;;
          esac
          {
            echo "module=$MODULE"
            echo "directory=$DIRECTORY"
            echo "version=$VERSION"
            echo "arguments=$ARGUMENTS"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $MODULE $VERSION via $ARGUMENTS"

      - name: Verify the tag matches the module version
        run: |
          DECLARED=$(grep -E '^version=' "${{ steps.target.outputs.directory }}/gradle.properties" | cut -d= -f2)
          if [ "$DECLARED" != "${{ steps.target.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.target.outputs.version }} but ${{ steps.target.outputs.directory }}/gradle.properties says $DECLARED"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-${{ runner.os }}-java-25-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', './gradle/wrapper/**') }}
          restore-keys: |
            release-${{ runner.os }}-java-25-

      - name: Build
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.configuration-cache=false
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=1
        run: ./gradlew build

      - name: Publish ${{ steps.target.outputs.module }} ${{ steps.target.outputs.version }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          PUBLISHING_USERNAME: ${{ secrets.PUBLISHING_USERNAME }}
          PUBLISHING_PASSWORD: ${{ secrets.PUBLISHING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          GRADLE_OPTS: >-
            -Dorg.gradle.configuration-cache=false
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=1
        run: ./gradlew -Psign ${{ steps.target.outputs.arguments }}
